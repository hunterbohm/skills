<text x="160" y="399" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">and statements</text>
<circle cx="416" cy="268" r="9" fill="#0E0F12" stroke="#8A8F98" stroke-width="2"/>
<text x="416" y="320" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8A8F98" text-anchor="middle" letter-spacing="1.5">02</text>
<text x="416" y="350" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#EDEEF0" text-anchor="middle">Collect</text>
<text x="416" y="378" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">Receipts, card charges,</text>
<text x="416" y="399" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">app stores</text>

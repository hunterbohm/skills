<text x="96" y="92" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#EDEEF0">Subscription audit</text>
<text x="96" y="126" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#8A8F98">Your agent finds the charges. You choose. It cancels and brings back proof.</text>

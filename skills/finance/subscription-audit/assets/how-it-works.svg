<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
<rect width="1600" height="560" rx="24" fill="#0E0F12"/>
<text x="96" y="92" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#EDEEF0">Subscription audit</text>
<text x="96" y="126" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#8A8F98">Your agent finds the charges. You choose. It cancels and brings back proof.</text>
<path d="M152 206 V196 H936 V206" fill="none" stroke="#2A2C33" stroke-width="1.5"/>
<text x="544.0" y="184" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle" letter-spacing="0.5">Reads only. Nothing changes.</text>
<path d="M1176 206 V196 H1448 V206" fill="none" stroke="#7C83FF" stroke-width="1.5"/>
<text x="1312.0" y="184" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#7C83FF" text-anchor="middle" letter-spacing="0.5">Only after your yes</text>
<line x1="160" y1="268" x2="928" y2="268" stroke="#2A2C33" stroke-width="2"/>
<line x1="928" y1="268" x2="1440" y2="268" stroke="#7C83FF" stroke-width="2"/>
<circle cx="160" cy="268" r="9" fill="#0E0F12" stroke="#8A8F98" stroke-width="2"/>
<text x="160" y="320" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8A8F98" text-anchor="middle" letter-spacing="1.5">01</text>
<text x="160" y="350" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#EDEEF0" text-anchor="middle">Set up</text>
<text x="160" y="378" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">Your list, inboxes</text>
<text x="160" y="399" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">and statements</text>
<circle cx="416" cy="268" r="9" fill="#0E0F12" stroke="#8A8F98" stroke-width="2"/>
<text x="416" y="320" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8A8F98" text-anchor="middle" letter-spacing="1.5">02</text>
<text x="416" y="350" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#EDEEF0" text-anchor="middle">Collect</text>
<text x="416" y="378" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">Receipts, card charges,</text>
<text x="416" y="399" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">app stores</text>
<circle cx="672" cy="268" r="9" fill="#0E0F12" stroke="#8A8F98" stroke-width="2"/>
<text x="672" y="320" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8A8F98" text-anchor="middle" letter-spacing="1.5">03</text>
<text x="672" y="350" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#EDEEF0" text-anchor="middle">Match</text>
<text x="672" y="378" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">Every charge against</text>
<text x="672" y="399" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">your list</text>
<circle cx="928" cy="268" r="15" fill="#0E0F12" stroke="#7C83FF" stroke-width="2"/><circle cx="928" cy="268" r="5" fill="#7C83FF"/>
<text x="928" y="320" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8A8F98" text-anchor="middle" letter-spacing="1.5">04</text>
<text x="928" y="350" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#EDEEF0" text-anchor="middle">Decide</text>
<text x="928" y="378" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">You see one table</text>
<text x="928" y="399" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">and pick</text>
<circle cx="1184" cy="268" r="9" fill="#7C83FF"/>
<text x="1184" y="320" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8A8F98" text-anchor="middle" letter-spacing="1.5">05</text>
<text x="1184" y="350" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#EDEEF0" text-anchor="middle">Cancel</text>
<text x="1184" y="378" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">Only what</text>
<text x="1184" y="399" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">you named</text>
<circle cx="1440" cy="268" r="9" fill="#7C83FF"/>
<text x="1440" y="320" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8A8F98" text-anchor="middle" letter-spacing="1.5">06</text>
<text x="1440" y="350" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#EDEEF0" text-anchor="middle">Prove</text>
<text x="1440" y="378" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">End date, receipt,</text>
<text x="1440" y="399" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">list updated</text>
<path d="M1440 418 V470 H416 V418" fill="none" stroke="#2A2C33" stroke-width="1.5" stroke-dasharray="4 6"/>
<path d="M410 427 L416 417 L422 427" fill="none" stroke="#8A8F98" stroke-width="1.5"/>
<rect x="703.0" y="456" width="450" height="28" fill="#0E0F12"/>
<text x="928.0" y="475" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">Next audit starts by checking that nothing charged again</text>
</svg>
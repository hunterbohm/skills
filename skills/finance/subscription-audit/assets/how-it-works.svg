<text x="672" y="320" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#8A8F98" text-anchor="middle" letter-spacing="1.5">03</text>
<text x="672" y="350" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#EDEEF0" text-anchor="middle">Match</text>
<text x="672" y="378" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">Every charge against</text>
<text x="672" y="399" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#8A8F98" text-anchor="middle">your list</text>
